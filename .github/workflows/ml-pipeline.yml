name: ML Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"      # every day at 02:00 UTC
  workflow_dispatch:          # manual "Run workflow" button

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Code flow (format, quality, security, tests)
        run: python pipeline_prefect.py --flow code

      - name: Full pipeline (train + evaluate)
        run: python pipeline_prefect.py --flow all

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: "*.joblib"
